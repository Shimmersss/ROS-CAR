name: unit-tests

# Pure-Python unit tests only (scripts/ci_unit_tests.sh). No ROS runtime, colcon build,
# hardware, model weights or recordings: a pass here is not a Jetson or vehicle check.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # ROS 2 Humble's Python
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.6 opencv-python-headless==5.0.0.93 pyyaml==6.0.3 pytest==9.1.1 websocket-client==1.9.2
      - name: Unit tests
        run: scripts/ci_unit_tests.sh
