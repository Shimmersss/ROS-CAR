offline_asr:
  ros__parameters:
    capture_device: plughw:CARD=XFMDPV0018,DEV=0
    sample_rate: 16000
    frame_ms: 40
    energy_threshold: 2800.0
    speech_onset_ms: 80
    silence_ms: 1200
    speech_timeout_sec: 30.0
    max_utterance_sec: 15.0
    wake_topic: ''
    wake_text_topic: /voice_words
    trusted_wake_text: 小车唤醒
    wake_cycle_delay_sec: 1.0
    speaking_topic: /voice/speaking
    output_topic: /voice/asr_text
    asr_backend: qwen3
    vad_model: /home/wheeltec/ROSCAR-offline/models/silero_vad.onnx
    vad_threshold: 0.5
    vad_min_speech_s: 0.12
    vad_silence_s: 0.7
    vad_max_speech_s: 8.0
    tts_cooldown_s: 0.2
    max_result_age_s: 6.0
    num_threads: 2

voice_command_router:
  ros__parameters:
    enabled: true
    input_topic: /voice/asr_text
    command_topic: /voice/command
    result_topic: /voice/command_result
    control_request_topic: /chassis/cmd_vel
    control_timeout_s: 2.0
    session_timeout_s: 30.0
    legacy_listen_polling: false
    default_forward_mps: 0.2
    default_reverse_mps: -0.2
    default_turn_rps: 0.25
    default_duration_s: 2.0
    base_frame: base_link

offline_tts:
  ros__parameters:
    input_topic: /voice/tts_text
    playback_device: plughw:CARD=Device,DEV=0
    max_text_chars: 300
    num_threads: 2
    speech_speed: 1.0
