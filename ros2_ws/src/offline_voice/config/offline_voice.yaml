offline_asr:
  ros__parameters:
    capture_device: plughw:CARD=XFMDPV0018,DEV=0
    sample_rate: 16000
    frame_ms: 40
    energy_threshold: 2800.0
    speech_onset_ms: 80
    silence_ms: 1200
    speech_timeout_sec: 30.0
    max_utterance_sec: 15.0
    wake_topic: ''
    wake_text_topic: /voice_words
    trusted_wake_text: 小车唤醒
    wake_cycle_delay_sec: 1.0
    speaking_topic: /voice/speaking
    output_topic: /voice/asr_text
    audio_source: topic
    vad_backend: silero
    endpoint_silence_s: 0.6
    hotwords_enabled: false
    asr_backend: qwen3
    num_threads: 2

voice_command_router:
  ros__parameters:
    enabled: true
    input_topic: /voice/asr_text
    command_topic: /voice/command
    result_topic: /voice/command_result
    followup_window_s: 8.0

voice_audio_capture:
  ros__parameters:
    capture_device: plughw:CARD=XFMDPV0018,DEV=0

chassis_motion_adapter:
  ros__parameters:
    chassis: ackermann
    turn_calibrated: false
    micro_calibrated: false
    forward_mps: 0.2
    reverse_mps: 0.2
    turn_linear_mps: 0.08
    turn_rps: 0.2
    min_turn_radius_m: 0.4
    duration_s: 2.0
    micro_mps: 0.05
    micro_turn_rps: 0.1
    micro_duration_s: 0.5

offline_tts:
  ros__parameters:
    input_topic: /voice/tts_text
    playback_device: plughw:CARD=Device,DEV=0
    max_text_chars: 300
    num_threads: 2
    speech_speed: 1.0
