lidar_left:
  lslidar_driver_node:
    ros__parameters:
      # 雷达型号与通讯配置
      lidar_type: "X10"
      lidar_model: "M10P"
      serial_port: "/dev/wheeltec_lidar"  # 请确保绑定了左侧实际串口名

      # 基础数据话题与坐标系设置
      frame_id: "laser1"
      pointcloud_topic: "lslidar_point_cloud"
      laserscan_topic: "/scan1"
      publish_scan: true

      # 距离与角度过滤
      min_range: 0.05
      max_range: 20.0
      angle_disable_min: [11000]
      angle_disable_max: [23500]
      
      # 网络占位配置(即使使用串口，保留此项可防止底层驱动去监听同一组默认端口导致崩溃)
      device_ip: "192.168.1.200"
      msop_port: 2368
      difop_port: 2369