<title id="title">方案 A｜Astra SDK 人体骨架路线</title><desc id="desc">原厂骨架识别、项目适配器、质心定位和 Foxglove 基础链路已在 Jetson 实机验证；扩展场景与 SDK 授权含义仍待验证。</desc>
